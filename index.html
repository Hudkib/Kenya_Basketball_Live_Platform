<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBL · Kenya Basketball League</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #070b14; color: #eef3fc; overflow-x: hidden; }
    h1, h2, h3, h4, h5 { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.02em; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0d1224; }
    ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 99px; }
    
    .bg-card { background: #0d1224; border: 1px solid #1f2a44; }
    .bg-card-hover { background: #141b30; border: 1px solid #1f2a44; }
    .text-orange { color: #f97316; }
    .border-orange { border-color: #f97316; }
    
    .btn-orange { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; transition: all 0.3s; }
    .btn-orange:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 30px rgba(249,115,22,0.4); }
    
    .live-dot { display: inline-block; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: blink 1.4s infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    
    .glass { background: rgba(13, 18, 36, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid #1f2a44; }
    .sidebar { background: #0d1224; border-right: 1px solid #1f2a44; }
    .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1rem; border-radius: 12px; color: #8da0c0; transition: all 0.3s; cursor: pointer; position: relative; overflow: hidden; }
    .sidebar-link::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(249,115,22,0.1), transparent); opacity: 0; transition: opacity 0.3s; }
    .sidebar-link:hover::before { opacity: 1; }
    .sidebar-link:hover { color: #fff; background: rgba(249,115,22,0.05); }
    .sidebar-link.active { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; box-shadow: 0 4px 20px rgba(249,115,22,0.3); }
    .sidebar-link.active::before { opacity: 1; }
    
    .stat-card { background: #141b30; border: 1px solid #1f2a44; border-radius: 16px; padding: 1rem; transition: all 0.3s; position: relative; overflow: hidden; }
    .stat-card::after { content: ''; position: absolute; top: -50%; right: -50%; width: 100%; height: 100%; background: radial-gradient(circle, rgba(249,115,22,0.05), transparent); opacity: 0; transition: opacity 0.3s; }
    .stat-card:hover { border-color: #f97316; transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
    .stat-card:hover::after { opacity: 1; }
    
    .match-card { background: #141b30; border: 1px solid #1f2a44; border-radius: 14px; padding: 1rem; transition: all 0.3s; }
    .match-card:hover { border-color: #f97316; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    
    .team-logo { width: 40px; height: 40px; background: linear-gradient(135deg, #1c2540, #2a3550); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border: 1px solid #2e3d60; transition: all 0.3s; }
    .match-card:hover .team-logo { border-color: #f97316; transform: scale(1.05); }
    
    .player-avatar { width: 48px; height: 48px; background: linear-gradient(135deg, #f97316, #ea580c); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.2rem; color: #fff; transition: all 0.3s; box-shadow: 0 4px 15px rgba(249,115,22,0.3); }
    .player-avatar:hover { transform: scale(1.1) rotate(-5deg); }
    
    .spill { padding: 0.15rem 0.6rem; border-radius: 99px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }
    .spill-live { background: rgba(239,68,68,0.15); color: #ef4444; animation: pulse-live 1.5s infinite; }
    @keyframes pulse-live { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    .spill-final { background: rgba(34,197,94,0.15); color: #22c55e; }
    .spill-upcoming { background: rgba(250,204,21,0.15); color: #facc15; }
    
    .nav-tab { padding: 0.5rem 1rem; border-radius: 10px; color: #8da0c0; cursor: pointer; transition: all 0.3s; font-weight: 500; }
    .nav-tab:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .nav-tab.active { background: #f97316; color: #fff; box-shadow: 0 4px 20px rgba(249,115,22,0.3); }
    
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: #0d1224; border: 1px solid #1f2a44; border-radius: 12px; padding: 0.9rem 1.4rem; z-index: 9999; font-size: 0.85rem; display: flex; align-items: center; gap: 0.7rem; transform: translateY(120px); opacity: 0; transition: all 0.35s cubic-bezier(0.2,0.9,0.3,1); max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: #22c55e; }
    .toast.success i { color: #22c55e; }
    .toast.error { border-color: #ef4444; }
    .toast.error i { color: #ef4444; }
    
    /* Flashy Login */
    .login-box { max-width: 420px; margin: 0 auto; background: linear-gradient(135deg, #0d1224, #141b30); border: 1px solid rgba(249,115,22,0.3); border-radius: 28px; padding: 2.5rem; position: relative; overflow: hidden; box-shadow: 0 25px 80px rgba(249,115,22,0.15); }
    .login-box::before { content: ''; position: absolute; top: -50%; right: -50%; width: 100%; height: 100%; background: radial-gradient(circle, rgba(249,115,22,0.08), transparent); animation: rotateGlow 20s linear infinite; }
    @keyframes rotateGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .login-box .logo-ball { width: 80px; height: 80px; font-size: 2.8rem; margin: 0 auto 1rem; border-radius: 28px; background: linear-gradient(135deg, #f97316, #ea580c); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 40px rgba(249,115,22,0.4); animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .login-box h2 { font-size: 2.4rem; background: linear-gradient(135deg, #fff, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .login-box p { color: #8da0c0; margin-bottom: 1.5rem; }
    input, select { width: 100%; padding: 0.8rem 1rem; background: #1c2540; border: 1px solid #1f2a44; border-radius: 14px; color: #eef3fc; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; transition: all 0.3s; }
    input:focus, select:focus { outline: none; border-color: #f97316; box-shadow: 0 0 0 4px rgba(249,115,22,0.1); }
    .frow { margin-bottom: 0.9rem; }
    .frow label { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #4a5a78; margin-bottom: 0.35rem; }
    .login-error { color: #ef4444; font-size: 0.8rem; min-height: 1.6rem; margin-top: 0.25rem; }
    .demo-credentials { margin-top: 1.5rem; font-size: 0.75rem; color: #4a5a78; border-top: 1px solid #1f2a44; padding-top: 1.2rem; }
    .demo-credentials code { background: #1c2540; padding: 0.1rem 0.5rem; border-radius: 6px; font-family: monospace; font-size: 0.7rem; color: #facc15; border: 1px solid #2e3d60; }
    
    @media (max-width: 768px) { 
      .sidebar { position: fixed; left: -280px; top: 0; bottom: 0; width: 280px; z-index: 1000; transition: left 0.3s ease; overflow-y: auto; } 
      .sidebar.open { left: 0; } 
      .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 999; display: none; } 
      .overlay.open { display: block; } 
      .login-box { padding: 1.8rem; margin: 1rem; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
  const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

  // ─── DATA ──────────────────────────────────────────────
  const initialGames = [
    { id: 1, team1: 'Nairobi Thunder', team2: 'Coastal Kings', score1: 89, score2: 84, time: new Date(Date.now()-86400000).toISOString(), status: 'Final' },
    { id: 2, team1: 'Kisumu Lakers', team2: 'Eldoret Hawks', score1: 76, score2: 72, time: new Date(Date.now()-172800000).toISOString(), status: 'Final' },
    { id: 3, team1: 'Nakuru Broncos', team2: 'Thika Bucks', score1: 54, score2: 49, time: new Date().toISOString(), status: 'Live' },
    { id: 4, team1: 'Mombasa Kings', team2: 'Kitale Wolves', score1: 0, score2: 0, time: new Date(Date.now()+7200000).toISOString(), status: 'Upcoming' },
    { id: 5, team1: 'Nyeri Lions', team2: 'Kakamega Tigers', score1: 0, score2: 0, time: new Date(Date.now()+14400000).toISOString(), status: 'Upcoming' },
  ];

  const initialTeams = [
    { id: 1, name: 'Nairobi Thunder', city: 'Nairobi', wins: 14, losses: 4, pts: 1789 },
    { id: 2, name: 'Coastal Kings', city: 'Mombasa', wins: 12, losses: 6, pts: 1723 },
    { id: 3, name: 'Kisumu Lakers', city: 'Kisumu', wins: 11, losses: 7, pts: 1698 },
    { id: 4, name: 'Eldoret Hawks', city: 'Eldoret', wins: 9, losses: 9, pts: 1654 },
    { id: 5, name: 'Nakuru Broncos', city: 'Nakuru', wins: 8, losses: 10, pts: 1623 },
    { id: 6, name: 'Thika Bucks', city: 'Thika', wins: 7, losses: 11, pts: 1598 },
  ];

  const initialPlayers = [
    { id: 1, name: 'John Mbugua', team: 'Nairobi Thunder', ppg: 28.5, rpg: 8.2, apg: 4.1, spg: 1.8, bpg: 0.9, fg: 52.3 },
    { id: 2, name: 'Kevin Omondi', team: 'Kisumu Lakers', ppg: 24.2, rpg: 5.3, apg: 7.2, spg: 2.1, bpg: 0.3, fg: 48.7 },
    { id: 3, name: 'James Otieno', team: 'Coastal Kings', ppg: 22.8, rpg: 7.1, apg: 3.5, spg: 1.4, bpg: 1.1, fg: 49.2 },
    { id: 4, name: 'Peter Wanjala', team: 'Eldoret Hawks', ppg: 18.5, rpg: 11.2, apg: 2.1, spg: 0.8, bpg: 2.3, fg: 55.1 },
    { id: 5, name: 'David Kipchoge', team: 'Nakuru Broncos', ppg: 16.8, rpg: 6.8, apg: 5.5, spg: 1.5, bpg: 0.4, fg: 46.8 },
    { id: 6, name: 'Samuel Waweru', team: 'Thika Bucks', ppg: 15.2, rpg: 4.9, apg: 6.1, spg: 2.3, bpg: 0.2, fg: 44.1 },
  ];

  const initialFixtures = [
    { id: 1, team1: 'Nairobi Thunder', team2: 'Kisumu Lakers', date: new Date(Date.now()+86400000).toISOString(), venue: 'Nyayo Gymnasium' },
    { id: 2, team1: 'Coastal Kings', team2: 'Eldoret Hawks', date: new Date(Date.now()+172800000).toISOString(), venue: 'Mombasa Sports Club' },
    { id: 3, team1: 'Nakuru Broncos', team2: 'Thika Bucks', date: new Date(Date.now()+259200000).toISOString(), venue: 'Nakuru Indoor Arena' },
  ];

  // ─── CONTEXT ────────────────────────────────────────────
  const AppContext = React.createContext();

  function AppProvider({ children }) {
    const [games, setGames] = useState(() => {
      try { const g = localStorage.getItem('kbl_games'); return g ? JSON.parse(g) : initialGames; } catch { return initialGames; }
    });
    const [teams, setTeams] = useState(() => {
      try { const t = localStorage.getItem('kbl_teams'); return t ? JSON.parse(t) : initialTeams; } catch { return initialTeams; }
    });
    const [players, setPlayers] = useState(() => {
      try { const p = localStorage.getItem('kbl_players'); return p ? JSON.parse(p) : initialPlayers; } catch { return initialPlayers; }
    });
    const [fixtures, setFixtures] = useState(() => {
      try { const f = localStorage.getItem('kbl_fixtures'); return f ? JSON.parse(f) : initialFixtures; } catch { return initialFixtures; }
    });
    const [savedGames, setSavedGames] = useState(() => {
      try { const s = localStorage.getItem('kbl_saved'); return s ? JSON.parse(s) : []; } catch { return []; }
    });
    const [user, setUser] = useState(null);
    const [toast, setToast] = useState(null);

    useEffect(() => {
      localStorage.setItem('kbl_games', JSON.stringify(games));
      localStorage.setItem('kbl_teams', JSON.stringify(teams));
      localStorage.setItem('kbl_players', JSON.stringify(players));
      localStorage.setItem('kbl_fixtures', JSON.stringify(fixtures));
      localStorage.setItem('kbl_saved', JSON.stringify(savedGames));
    }, [games, teams, players, fixtures, savedGames]);

    const showToast = (msg, type = 'success') => {
      setToast({ msg, type });
      setTimeout(() => setToast(null), 3000);
    };

    const addGame = (game) => { setGames([...games, { ...game, id: Date.now() }]); showToast('Game added!'); };
    const deleteGame = (id) => { setGames(games.filter(g => g.id !== id)); setSavedGames(savedGames.filter(s => s !== id)); showToast('Game deleted'); };
    const updateGame = (id, data) => {
      setGames(games.map(g => g.id === id ? { ...g, ...data } : g));
      showToast('Game updated!');
    };
    const toggleSave = (id) => {
      setSavedGames(prev => prev.includes(id) ? prev.filter(s => s !== id) : [...prev, id]);
      showToast(prev => prev.includes(id) ? 'Removed from saved' : 'Game saved!');
    };

    const login = (role, password) => {
      if ((role === 'admin' && password === 'admin123') || (role === 'client' && password === 'client123')) {
        setUser({ role });
        showToast(`Welcome ${role}!`);
        return true;
      }
      showToast('Invalid credentials', 'error');
      return false;
    };
    const logout = () => { setUser(null); showToast('Logged out'); };

    const value = {
      games, setGames, teams, setTeams, players, setPlayers, fixtures, setFixtures,
      savedGames, setSavedGames, user, login, logout, showToast, toast,
      addGame, deleteGame, updateGame, toggleSave
    };
    return React.createElement(AppContext.Provider, { value }, children);
  }

  function useApp() { return useContext(AppContext); }

  // ─── TOAST ──────────────────────────────────────────────
  function Toast() {
    const { toast } = useApp();
    if (!toast) return null;
    return React.createElement('div', {
      className: `toast show ${toast.type}`,
      role: 'status'
    }, [
      React.createElement('i', { key: 'icon', className: `fas ${toast.type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}` }),
      React.createElement('span', { key: 'msg' }, toast.msg)
    ]);
  }

  // ─── FLASHY LOGIN ──────────────────────────────────────
  function LoginPage() {
    const { login } = useApp();
    const [role, setRole] = useState('admin');
    const [password, setPassword] = useState('');
    const [error, setError] = useState('');
    const [isLoading, setIsLoading] = useState(false);

    const handleSubmit = (e) => {
      e.preventDefault();
      setIsLoading(true);
      setTimeout(() => {
        if (login(role, password)) {
          setError('');
        } else {
          setError('Invalid password for ' + role);
        }
        setIsLoading(false);
      }, 600);
    };

    return React.createElement('div', { 
      className: 'min-h-screen flex items-center justify-center p-4',
      style: { 
        background: 'radial-gradient(ellipse at center, #0d1224 0%, #070b14 100%)',
        position: 'relative',
        overflow: 'hidden'
      }
    }, [
      // Animated background elements
      React.createElement('div', { key: 'bg1', className: 'absolute w-96 h-96 rounded-full bg-orange-500/5 blur-3xl', style: { top: '-10%', right: '-10%', animation: 'float 8s ease-in-out infinite' } }),
      React.createElement('div', { key: 'bg2', className: 'absolute w-96 h-96 rounded-full bg-purple-500/5 blur-3xl', style: { bottom: '-10%', left: '-10%', animation: 'float 10s ease-in-out infinite reverse' } }),
      React.createElement('div', { key: 'bg3', className: 'absolute w-64 h-64 rounded-full bg-orange-500/10 blur-2xl', style: { top: '50%', left: '50%', transform: 'translate(-50%, -50%)', animation: 'pulse 4s ease-in-out infinite' } }),
      
      React.createElement('div', { className: 'login-box w-full max-w-md relative z-10' }, [
        React.createElement('div', { key: 'logo', className: 'logo-ball' }, '🏀'),
        React.createElement('h2', { key: 'h2', className: 'text-center' }, 'KBL'),
        React.createElement('p', { key: 'p', className: 'text-center' }, 'Sign in to the Kenya Basketball League'),
        React.createElement('form', { key: 'form', onSubmit: handleSubmit, className: 'space-y-4' }, [
          React.createElement('div', { key: 'role' }, [
            React.createElement('label', { className: 'frow label' }, 'Account type'),
            React.createElement('select', {
              value: role,
              onChange: (e) => setRole(e.target.value),
              className: 'w-full'
            }, [
              React.createElement('option', { value: 'admin' }, 'Admin'),
              React.createElement('option', { value: 'client' }, 'Client')
            ])
          ]),
          React.createElement('div', { key: 'pwd' }, [
            React.createElement('label', { className: 'frow label' }, 'Password'),
            React.createElement('input', {
              type: 'password',
              value: password,
              onChange: (e) => setPassword(e.target.value),
              placeholder: 'Enter your password',
              className: 'w-full'
            })
          ]),
          error && React.createElement('div', { key: 'err', className: 'login-error' }, error),
          React.createElement('button', {
            key: 'btn',
            type: 'submit',
            disabled: isLoading,
            className: 'btn-orange w-full py-3.5 rounded-xl font-semibold text-base transition-all disabled:opacity-60'
          }, [
            isLoading ? React.createElement('i', { key: 'spin', className: 'fas fa-spinner fa-spin mr-2' }) : React.createElement('i', { key: 'icon', className: 'fas fa-sign-in-alt mr-2' }),
            isLoading ? 'Signing in...' : 'Sign In'
          ])
        ]),
        React.createElement('div', { key: 'demo', className: 'demo-credentials text-center' }, [
          React.createElement('strong', null, 'Demo Credentials'),
          React.createElement('br', null),
          'Admin · ', React.createElement('code', null, 'admin123'),
          React.createElement('span', { className: 'mx-2 text-gray-600' }, '|'),
          'Client · ', React.createElement('code', null, 'client123')
        ])
      ])
    ]);
  }

  // ─── SIDEBAR ────────────────────────────────────────────
  function Sidebar({ currentPage, setPage, user }) {
    const links = [
      { id: 'landing', icon: 'fa-home', label: 'Landing' },
      { id: 'dashboard', icon: 'fa-chart-pie', label: 'Fan Dashboard' },
      { id: 'live', icon: 'fa-bolt', label: 'Live Score Center' },
      { id: 'teams', icon: 'fa-users', label: 'Teams' },
      { id: 'players', icon: 'fa-user', label: 'Players' },
      { id: 'fixtures', icon: 'fa-calendar-alt', label: 'Fixtures' },
      { id: 'standings', icon: 'fa-trophy', label: 'Standings' },
      { id: 'statistics', icon: 'fa-chart-bar', label: 'Statistics' },
    ];
    if (user?.role === 'admin') links.push({ id: 'admin', icon: 'fa-cogs', label: 'Admin Dashboard' });
    links.push({ id: 'settings', icon: 'fa-cog', label: 'Settings' });

    return React.createElement('div', { className: 'sidebar fixed top-0 left-0 h-full w-64 p-4 flex flex-col overflow-y-auto z-50 transition-all' }, [
      React.createElement('div', { key: 'logo', className: 'flex items-center gap-3 mb-6' }, [
        React.createElement('div', { className: 'w-10 h-10 bg-gradient-to-br from-orange-500 to-orange-600 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-orange-500/30' }, '🏀'),
        React.createElement('div', null, [
          React.createElement('div', { className: 'text-xl font-bold leading-tight bg-gradient-to-r from-white to-orange-400 bg-clip-text text-transparent' }, 'KBL'),
          React.createElement('div', { className: 'text-[10px] text-gray-500 tracking-widest' }, 'KENYA BASKETBALL')
        ])
      ]),
      React.createElement('div', { key: 'nav', className: 'flex-1 space-y-1' },
        links.map(link =>
          React.createElement('div', {
            key: link.id,
            className: `sidebar-link ${currentPage === link.id ? 'active' : ''}`,
            onClick: () => setPage(link.id)
          }, [
            React.createElement('i', { className: `fas ${link.icon} w-5` }),
            React.createElement('span', null, link.label)
          ])
        )
      ),
      React.createElement('div', { key: 'footer', className: 'border-t border-gray-700 pt-4 mt-auto' }, [
        React.createElement('div', { className: 'flex items-center gap-2 text-sm text-gray-400' }, [
          React.createElement('span', { className: 'live-dot' }),
          React.createElement('span', null, 'LIVE')
        ]),
        React.createElement('button', {
          className: 'w-full mt-3 py-2 text-sm text-gray-400 hover:text-white border border-gray-700 rounded-xl transition-all hover:border-orange-500 hover:bg-orange-500/10',
          onClick: () => { const { logout } = useApp(); logout(); }
        }, [
          React.createElement('i', { className: 'fas fa-sign-out-alt mr-2' }),
          'Logout'
        ])
      ])
    ]);
  }

  // ─── LANDING ────────────────────────────────────────────
  function LandingPage() {
    const { games, teams, players } = useApp();
    const live = games.filter(g => g.status === 'Live').length;
    return React.createElement('div', { className: 'space-y-6' }, [
      React.createElement('div', { key: 'hero', className: 'relative overflow-hidden bg-gradient-to-br from-orange-500/10 via-purple-500/5 to-orange-500/10 border border-orange-500/20 rounded-2xl p-8 md:p-10' }, [
        React.createElement('div', { className: 'absolute top-0 right-0 w-64 h-64 bg-orange-500/10 rounded-full blur-3xl' }),

          React.createElement('select', { value: newGame.status, onChange: (e) => setNewGame({ ...newGame, status: e.target.value }), className: 'w-full' }, [
            React.createElement('option', { value: 'Upcoming' }, 'Upcoming'),
            React.createElement('option', { value: 'Live' }, 'Live'),
            React.createElement('option', { value: 'Final' }, 'Final')

          React.createElement('button', { className: 'btn-orange px-6 py-2 rounded-xl', onClick: handleAdd }, 'Save Game'),

                React.createElement('div', { className: 'team-logo' }, '🏀'),
                React.createElement('span', { className: 'font-bold text-lg' }, g.team1)
              ]),
              React.createElement('div', { className: 'flex items-center gap-2' }, [
                React.createElement('span', { className: 'text-2xl font-bold text-orange-500' }, g.score1),
                React.createElement('span', { className: 'text-gray-500' }, '–'),
                React.createElement('span', { className: 'text-2xl font-bold text-orange-500' }, g.score2)
              ]),
              React.createElement('div', { className: 'flex items-center gap-3' }, [
                React.createElement('span', { className: 'font-bold text-lg' }, g.team2),
                React.createElement('div', { className: 'team-logo' }, '🏀')
              ])
            ]),
            React.createElement('div', { className: 'flex justify-between items-center mt-3 pt-3 border-t border-gray-700' }, [
              React.createElement('span', { className: `spill ${g.status === 'Live' ? 'spill-live' : g.status === 'Final' ? 'spill-final' : 'spill-upcoming'}` }, g.status),
              React.createElement('div', { className: 'flex gap-2' }, [
                React.createElement('button', { 
                  className: 'text-sm text-gray-400 hover:text-white px-3 py-1 rounded-lg bg-gray-800 hover:bg-gray-700 transition-all',
                  onClick: () => { const s = ['Upcoming', 'Live', 'Final']; const idx = s.indexOf(g.status); updateGame(g.id, { status: s[(idx + 1) % s.length] }); }

  }

    const { user, logout } = useApp();
    return React.createElement('div', { className: 'space-y-6' }, [
      React.createElement('h2', { className: 'text-3xl font-bold bg-gradient-to-r from-white to-orange-400 bg-clip-text text-transparent' }, 'Settings'),

  // ─── APP ────────────────────────────────────────────────
  function App() {
    const { user } = useApp();
    const [page, setPage] = useState('landing');
    const [sidebarOpen, setSidebarOpen] = useState(false);

    if (!user) return React.createElement(LoginPage);

    const pages = {
      landing: React.createElement(LandingPage),
      dashboard: React.createElement(FanDashboard),
      live: React.createElement(LiveScoreCenter),
      teams: React.createElement(TeamsPage),
      players: React.createElement(PlayersPage),
      fixtures: React.createElement(FixturesPage),
      standings: React.createElement(StandingsPage),
      statistics: React.createElement(StatisticsPage),
      admin: user?.role === 'admin' ? React.createElement(AdminDashboard) : React.createElement('div', null, 'Access denied'),
      settings: React.createElement(SettingsPage)
    };

    return React.createElement('div', { className: 'min-h-screen flex' }, [
      React.createElement('div', { key: 'overlay', className: `overlay ${sidebarOpen ? 'open' : ''}`, onClick: () => setSidebarOpen(false) }),
      React.createElement(Sidebar, { key: 'sidebar', currentPage: page, setPage, user }),
      React.createElement('div', { key: 'main', className: 'flex-1 p-4 md:p-6 ml-0 md:ml-64' }, [
        React.createElement('div', { className: 'flex items-center gap-3 mb-4 md:hidden' }, [
          React.createElement('button', { 
            className: 'text-2xl text-gray-400 hover:text-white transition-all',
            onClick: () => setSidebarOpen(true)
          }, [
            React.createElement('i', { className: 'fas fa-bars' })
          ]),
          React.createElement('span', { className: 'text-xl font-bold bg-gradient-to-r from-white to-orange-400 bg-clip-text text-transparent' }, 'KBL')
        ]),
        React.createElement(Toast, null),
        pages[page] || React.createElement('div', null, 'Page not found')
      ])
    ]);
  }

  // ─── ROOT ───────────────────────────────────────────────
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(
    React.createElement(AppProvider, null,
      React.createElement(App, null)
    )
  );
</script>
